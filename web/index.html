<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="价迹，发现日常里的价格变化。">
  <meta name="theme-color" content="#203D34">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="价迹">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>价迹 · 看见价格的变化</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f7f9f6; }
    #app-loader { position: fixed; inset: 0; display: grid; place-content: center;
      justify-items: center; gap: 16px; color: #203d34;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app-loader strong { font-size: 24px; letter-spacing: 3px; }
    #app-loader span { font-size: 13px; color: #879087; }
  </style>
</head>
<body>
  <div id="app-loader" role="status">
    <img src="favicon.svg" width="48" height="48" alt="">
    <strong>价迹</strong>
    <span>发现日常里的价格变化</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loader')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
